name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # o token de escrita nao fica no .git/config pros passos seguintes; o publish usa o GH_TOKEN do passo dele
          persist-credentials: false

      # Node 22 (o Electron 43 pede 22.12+) e npm ci: instala exatamente o package-lock.json e falha se ele nao bater com o package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      # O electron-builder publica na release v<versao do package.json>, nao na tag empurrada: tag sem o bump do
      # package.json subia os arquivos na release anterior (ou nao subia nada e o job passava verde)
      - name: Tag igual a versao do package.json
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - name: Build and publish
        run: npx --no-install electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Evidencia pra quando o Windows/navegador chama o instalador de virus: o Defender do proprio runner
      # varre os executaveis gerados e o resultado fica no log do build. Nao bloqueia o release.
      - name: Windows Defender scan (informativo)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -SignatureUpdate | Out-Null
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            Write-Host "== $($_.Name) =="
            & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File $_.FullName -DisableRemediation
          }
